spring.application.name=programacao-web-2

# Define que o Hibernate pode fazer alterações na estrutura do banco (ótimo para desenvolvimento)
spring.jpa.hibernate.ddl-auto=update

# Exibe no console os comandos SQL gerados pelo Hibernate
spring.jpa.show-sql=true

# Configurações da conexão com o banco de dados
spring.datasource.url=jdbc:mysql://localhost:3306/projetinho_nota1
spring.datasource.username=root
spring.datasource.password=
# ATUALIZADO: Usando o driver mais recente para o MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver